<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GRAVITY'S ARK</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090d; touch-action: none; }
  #cv { width: 100%; height: 100%; display: block; }
  .pane { position: fixed; color: #e9edf2; font: 500 11px/1.5 ui-monospace, monospace; background: rgba(7,9,13,.62);
    padding: 5px 9px; border-radius: 8px; pointer-events: none; white-space: pre; }
  #title { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font: 600 12px/1.4 system-ui, sans-serif;
    letter-spacing: 0.25em; padding: 4px 12px; }
  #clocks { top: max(10px, env(safe-area-inset-top)); right: 12px; text-align: right; }
  #ship { top: max(10px, env(safe-area-inset-top)); left: 12px; }
  #log { left: 12px; bottom: max(78px, calc(env(safe-area-inset-bottom) + 70px)); max-width: 60vw; max-height: 26vh; overflow: hidden;
    color: rgba(233,237,242,.8); }
  #card { display: none; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; min-width: 240px; max-width: 86vw;
    padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(233,178,92,.5); background: rgba(7,9,13,.94); font: 500 12px/1.7 system-ui, sans-serif; white-space: normal; }
  #card .t { font-weight: 700; letter-spacing: 0.12em; color: #e9b25c; margin-bottom: 6px; }
  #btns { position: fixed; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, minmax(92px, 1fr)); gap: 6px; }
  button { min-width: 92px; padding: 10px 10px; border-radius: 10px; border: 1.5px solid rgba(233,237,242,.4); background: rgba(7,9,13,.6);
    color: #e9edf2; font: 600 11px system-ui, sans-serif; letter-spacing: 0.12em; }
  button.on { border-color: #e9b25c; color: #e9b25c; }
  button:disabled { opacity: 0.35; }
  #zoom { position: fixed; left: 12px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
  #zoom button { min-width: 44px; width: 44px; height: 40px; padding: 0; font-size: 16px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title" class="pane">GRAVITY'S ARK</div>
<div id="ship" class="pane">-</div>
<div id="clocks" class="pane">-</div>
<div id="log" class="pane"></div>
<div id="dock" class="pane" style="display:none; right: 12px; top: 40%; transform: translateY(-50%); pointer-events: auto; max-width: 46vw;"><div id="dockBody"></div><div id="dockBtns" style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;"><button id="buyFuel">FUEL +500</button><button id="buyScrap">SCRAP +500</button><button id="sellScrap">SELL SCRAP</button><button id="hireHand">HIRE</button><button id="takePeople">TAKE 1</button><button id="deliver">DELIVER</button><button id="hireOut">HIRE HER OUT</button></div></div>
<div id="card" class="pane"><div class="t">THE CARD</div><div id="cardBody"></div><button id="wake" style="display:none">WAKE</button><button id="again">NEW SEED</button></div>
<div id="gatePane" class="pane" style="display:none; left: 12px; top: 40%; transform: translateY(-50%); pointer-events: auto; max-width: 46vw;"><div id="gateBody"></div><div style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;"><button id="tollB">PAY TOLL</button><button id="passB">PASS</button><button id="sellSpare">SELL SPARE</button><button id="sellScrapF">SELL SCRAP</button><button id="sellPeople">SELL PEOPLE</button><button id="sellHer">SELL HER</button></div></div>
<div id="zoom"><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="pause">II</button></div>
<div id="btns">
  <button id="land">LAND</button>
  <button id="takeoff">TAKE OFF</button>
  <button id="burn">BURN</button>
  <button id="aim">AIM: GATE</button>
  <button id="castB">CAST</button>
  <button id="payB">PAY</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
